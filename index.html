<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMART TASMAC</title>
<style>
body {
  background:#090909;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:15px;
}
.card {
  background:#1b1b1b;
  padding:22px;
  margin:20px auto;
  border-radius:15px;
  max-width:450px;
}
input,select,button {
  width:100%;
  padding:14px;
  margin:10px 0;
  box-sizing:border-box;
  border-radius:8px;
  font-size:16px;
}
input,select {
  background:#080808;
  color:white;
  border:1px solid #555;
}
button {
  background:#e32636;
  color:white;
  border:0;
  font-weight:bold;
}
#purchase {display:none;}
</style>
</head>
<body>

<h1 style="color:#ff3030">SMART TASMAC</h1>

<div class="card">
<h2>Customer Verification</h2>
<input id="customer" placeholder="Enter Demo ID">
<button onclick="verifyCustomer()">VERIFY CUSTOMER</button>
<p id="message"></p>
</div>

<div class="card" id="purchase">
<h2>Customer Purchase</h2>
<p>Demo Daily Limit: 375 ml</p>
<p>Remaining: <b id="remaining">375 ml</b></p>

<select id="quantity">
<option value="90">90 ml</option>
<option value="180">180 ml</option>
<option value="375">375 ml</option>
</select>

<button onclick="buy()">CONFIRM DEMO PURCHASE</button>
<p id="result"></p>
</div>

<script>
let used = 0;

function verifyCustomer() {
  const id = document.getElementById("customer").value.trim().toUpperCase();
  const message = document.getElementById("message");
  const purchase = document.getElementById("purchase");

  if (id === "DEMO-1001" || id === "DEMO-1002") {
    message.innerText = "Verification Successful!";
    purchase.style.display = "block";
  } else {
    message.innerText = "Invalid ID! Use DEMO-1001 or DEMO-1002";
    purchase.style.display = "none";
  }
}

function buy() {
  const amount = Number(document.getElementById("quantity").value);

  if (used + amount > 375) {
    document.getElementById("result").innerText = "Demo limit exceeded!";
    return;
  }

  used += amount;
  document.getElementById("remaining").innerText = (375-used) + " ml";
  document.getElementById("result").innerText = "Demo Purchase Successful!";
}
</script>

</body>
</html>
